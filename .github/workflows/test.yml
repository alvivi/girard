name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18.1"
          rebar3-version: "3"
          # elixir-version: "1"
      - run: gleam deps download
      # Fail the build on any compiler warning in the library.
      - run: gleam build --warnings-as-errors
      - run: gleam test
      - run: gleam format --check src test dev
      # Lint the library. `warnings_as_errors = true` in gleam.toml makes any
      # remaining glinter warning a non-zero exit, so CI fails on it.
      - run: gleam run -m glinter
